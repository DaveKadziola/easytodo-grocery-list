{% extends "base.html" %}
{% block title %}Create account · EasyToDo{% endblock %}
{% block content %}
<div class="mx-auto w-full max-w-sm">
  <h1 class="text-2xl font-semibold">Create account</h1>
  <form method="post" action="/register" class="card mt-6 space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    {% if error %}<p role="alert" class="form-error">{{ error }}</p>{% endif %}
    <div>
      <label for="email" class="label">Email</label>
      <input id="email" name="email" type="email" value="{{ email }}" autocomplete="email" required autofocus class="input">
    </div>
    <div>
      <label for="password" class="label">Password</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="10" maxlength="256" aria-describedby="password-hint" class="input">
      <p id="password-hint" class="mt-1 text-sm text-slate-500">At least 10 characters.</p>
    </div>
    <button type="submit" class="btn-primary w-full">Create account</button>
  </form>
  <p class="mt-6 text-center text-sm text-slate-600">Already have an account? <a href="/login" class="link">Sign in</a></p>
</div>
{% endblock %}
