services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: easytodo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: easytodo
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easytodo -d easytodo"]
      interval: 5s
      timeout: 5s
      retries: 20
    # No published port: only the app container reaches the database.

  app:
    build:
      context: .
      dockerfile: deploy/Dockerfile
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${EASYTODO_PORT:-8000}:8000"
    restart: unless-stopped

volumes:
  pgdata:
