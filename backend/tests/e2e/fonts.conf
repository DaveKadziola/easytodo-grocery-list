<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  The fonts of the e2e browser. conftest.py gives this file to Chromium as FONTCONFIG_FILE, so
  that the page, which has no web font and asks for the system's (ui-sans-serif, system-ui,
  sans-serif), renders in Inter on every machine: the layout tests and their widths were measured
  with it, and a machine's own default (Inter here, DejaVu Sans on a stock Ubuntu, such as the CI
  runner) would change where words wrap. Needs the font itself: the Debian/Ubuntu package
  fonts-inter (conftest.py says so when it is missing).

  Only the three families of the page's sans-serif stack (the font-sans variable of app.css) are
  given; the emoji fonts after them and the monospace stack are the system's.

  The aliases come after the system's configuration and are "strong": a weak preference loses to
  the system's own (60-latin.conf prefers Noto Sans, then DejaVu Sans).
-->
<fontconfig>
  <include>/etc/fonts/fonts.conf</include>

  <alias binding="strong"><family>system-ui</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>ui-sans-serif</family><prefer><family>Inter</family></prefer></alias>
  <alias binding="strong"><family>sans-serif</family><prefer><family>Inter</family></prefer></alias>
</fontconfig>
