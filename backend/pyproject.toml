[project]
name = "easytodo"
version = "2.0.0.dev0"
description = "Self-hosted, multi-user grocery and to-do lists with real-time sync."
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.156.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.16.1",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.32",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "httpx>=0.28.1",
    "playwright==1.56.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-playwright>=0.10.0",
    "ruff>=0.17.1",
    "websockets>=17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["e2e: browser tests"]
addopts = '-m "not e2e"'
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.format]
# Alembic writes the migrations (single quotes, its own layout); they are linted, not formatted.
exclude = ["migrations/versions/*"]

[tool.ruff.lint]
extend-select = ["I", "UP"]
