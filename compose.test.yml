name: easytodo-test

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: easytodo
      POSTGRES_PASSWORD: easytodo
      POSTGRES_DB: easytodo_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U easytodo -d easytodo_test"]
      interval: 2s
      timeout: 5s
      retries: 30
