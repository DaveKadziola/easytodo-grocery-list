name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default; the `release` job alone writes, and only its tag and release.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned, not -latest: a new image can break the setup steps
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: easytodo
          POSTGRES_PASSWORD: easytodo
          POSTGRES_DB: easytodo_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U easytodo -d easytodo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      EASYTODO_DATABASE_URL: postgresql+asyncpg://easytodo:easytodo@localhost:54329/easytodo_test
      EASYTODO_SECRET_KEY: ci-only-secret-key-0123456789abcdef
      TEST_DATABASE_URL: postgresql+asyncpg://easytodo:easytodo@localhost:54329/easytodo_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: make css  # base.html links the built app.css, which is git-ignored
        working-directory: .
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest
      - run: python3 scripts/release-notes.py --self-test
        working-directory: .

  e2e:
    runs-on: ubuntu-24.04  # pinned, not -latest: a new image can break the setup steps
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: easytodo
          POSTGRES_PASSWORD: easytodo
          POSTGRES_DB: easytodo_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U easytodo -d easytodo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://easytodo:easytodo@localhost:54329/easytodo_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0
      - run: make css
        working-directory: .
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e

  docker:
    runs-on: ubuntu-24.04  # pinned, not -latest: a new image can break the setup steps
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Create .env from the example
        run: |
          cp .env.example .env
          sed -i "s/^EASYTODO_SECRET_KEY=.*/EASYTODO_SECRET_KEY=$(openssl rand -hex 32)/" .env
      - name: The proxy profile still parses
        run: |
          EASYTODO_DOMAIN=todo.example.com ACME_EMAIL=ci@example.com \
            docker compose --profile proxy config -q
      - run: docker compose build
      - run: docker compose up -d --wait
      - name: Smoke test
        run: |
          curl -fsS localhost:8000/healthz
          curl -fsS -o /dev/null localhost:8000/login
          curl -fsS -o /dev/null localhost:8000/static/css/app.css
          docker compose exec -T app alembic current | grep -F "(head)"
          migrations_run=$(docker compose logs app | grep -c "Running upgrade")
          test "$migrations_run" -ge 1
          docker compose restart app
          docker compose up -d --wait
          test "$(docker compose logs app | grep -c 'Running upgrade')" -eq "$migrations_run"
      - name: App and database logs
        if: failure()
        run: docker compose logs
      - name: Tear down
        if: always()
        run: docker compose down -v

  # A green run on main gets the next vX.Y.Z and a GitHub release (README "Releases").
  release:
    needs: [test, e2e, docker]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04  # pinned, not -latest: a new image can break the setup steps
    timeout-minutes: 5
    # Two quick merges must not both take the same next number; a newer run replaces a waiting one.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Tag and release main
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          tag="$(python3 scripts/release-notes.py --target "$GITHUB_SHA" --run-url "$RUN_URL" --out notes.md)"
          if [ -z "$tag" ]; then echo "$GITHUB_SHA is already in a release"; exit 0; fi
          gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
