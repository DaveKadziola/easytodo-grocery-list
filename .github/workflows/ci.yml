name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: easytodo
          POSTGRES_PASSWORD: easytodo
          POSTGRES_DB: easytodo_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U easytodo -d easytodo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      EASYTODO_DATABASE_URL: postgresql+asyncpg://easytodo:easytodo@localhost:54329/easytodo_test
      EASYTODO_SECRET_KEY: ci-only-secret-key-0123456789abcdef
      TEST_DATABASE_URL: postgresql+asyncpg://easytodo:easytodo@localhost:54329/easytodo_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest

  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: easytodo
          POSTGRES_PASSWORD: easytodo
          POSTGRES_DB: easytodo_test
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U easytodo -d easytodo_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://easytodo:easytodo@localhost:54329/easytodo_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
      - run: make css
        working-directory: .
      - run: uv sync --locked
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m e2e
